name: Bug report
description: Report a reproducible problem in Civic Ledger
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not post credentials, sensitive personal information, or unverified allegations.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact tokens, account identifiers, and private data.
